services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=tessle'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=tessle'
    ports:
      - '5432'
    volumes:
      - postgres-data:/var/lib/postgresql
  redis:
    image: 'redis:8'
    # AOF persistence: refresh-token families live in Redis (ADR 0004)
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379'
    volumes:
      - redis-data:/data
  rabbitmq:
    image: 'rabbitmq:4'
    environment:
      - 'RABBITMQ_DEFAULT_PASS=secret'
      - 'RABBITMQ_DEFAULT_USER=tessle'
    ports:
      - '5672'
volumes:
  postgres-data:
  redis-data:
