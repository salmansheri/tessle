server:
  # The browser reaches us through the Next.js proxy; trust its X-Forwarded-For for per-IP limits.
  # Only safe while the backend is not directly reachable from the internet.
  forward-headers-strategy: framework

spring:
  application:
    name: Lowcodebackend
  jackson:
    deserialization:
      # Requests with fields we do not define are refused, so a client cannot slip in options (ADR 0006).
      fail-on-unknown-properties: true
  jpa:
    # Platform queries must run inside a transaction, where tenant scoping is applied (ADR 0001).
    open-in-view: false
  mail:
    host: smtp.resend.com
    port: 587
    username: resend
    password: ${RESEND_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # Without timeouts a stalled SMTP connection blocks the listener thread forever.
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000
  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          max-retries: 4
          initial-interval: 1s
          multiplier: 2.0
          max-interval: 30s

tessle:
  # Required secrets (>= 32 bytes). Set in .env; the app refuses to start without them.
  jwt:
    secret: ${TESSLE_JWT_SECRET:}
  otp:
    secret: ${TESSLE_OTP_SECRET:}
  # Credentials master key: base64 of 32 random bytes (AES-256). The app refuses to start without it.
  # Rotating means adding a key with a new id; each stored secret remembers the id that sealed it.
  secrets:
    master-key: ${TESSLE_SECRETS_MASTER_KEY:}
    key-id: ${TESSLE_SECRETS_KEY_ID:k1}
  # Data sources may reach public addresses only, plus any private ranges listed here (CIDR, comma separated).
  # Loopback, link-local and cloud-metadata addresses are refused whatever is listed (ADR 0007).
  datasource:
    allowed-networks: ${TESSLE_DATASOURCE_ALLOWED_NETWORKS:}
  cookies:
    secure: ${TESSLE_COOKIES_SECURE:true}
  # Where emailed links point (the Next.js frontend).
  public-url: ${TESSLE_PUBLIC_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:onboarding@resend.dev}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
